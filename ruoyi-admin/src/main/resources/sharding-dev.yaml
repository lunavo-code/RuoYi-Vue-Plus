    username: root
    password: admin123

rules:
  - !SHARDING
    tables:
      intelligent_sms:
        # 6个分库，每个库4张分表
        actualDataNodes: 'ds_$->{0..5}.intelligent_sms_$->{0..3}'
        # 分库策略
        databaseStrategy:
          standard:
            shardingColumn: phone
            shardingAlgorithmName: intelligent_sms_database
        # 分表策略
        tableStrategy:
          standard:
            shardingColumn: phone
            shardingAlgorithmName: intelligent_sms_table

    # 分片算法
    shardingAlgorithms:
      # 6个分库
      intelligent_sms_database:
        type: INLINE
        props:
          algorithm-expression: 'ds_$->{(phone as Long).intdiv(10000) % 10000 % 6}'
      # 每个分库4张分表
      intelligent_sms_table:
        type: INLINE
        props:
          algorithm-expression: 'intelligent_sms_$->{((phone as Long) % 10000) % 4}'

